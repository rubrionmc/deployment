apiVersion: v1
kind: ServiceAccount
metadata:
  name: wayguard-sa

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wayguard-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wayguard-rolebinding
subjects:
  - kind: ServiceAccount
    name: wayguard-sa
roleRef:
  kind: Role
  name: wayguard-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wayguard-deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wayguard
  template:
    metadata:
      labels:
        app: wayguard
    spec:
      serviceAccountName: wayguard-sa
      containers:
        - name: rubrion-wayguard
          image: ghcr.io/rubrionmc/wayguard:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 25565
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "0.5"
              memory: "205Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: wayguard-service
spec:
  type: NodePort
  selector:
    app: wayguard
  ports:
    - port: 25565
      targetPort: 25565
      nodePort: 30001
