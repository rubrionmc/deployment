# dragonfly password – used by dragonfly itself and any service connecting to it
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-secret
  namespace: {{PREFIX}}-{{NAMESPACE}}
type: Opaque
stringData:
  password: "{{SECRET:dragonfly-pass}}"

---

# nats credentials – used by nats itself and any service connecting to it
apiVersion: v1
kind: Secret
metadata:
  name: nats-secret
  namespace: {{PREFIX}}-{{NAMESPACE}}
type: Opaque
stringData:
  username: "{{SECRET:nats-user}}"
  password: "{{SECRET:nats-pass}}"

---

# nats config file – mounted into the nats container at /etc/nats/nats.conf
apiVersion: v1
kind: Secret
metadata:
  name: nats-config-secret
  namespace: {{PREFIX}}-{{NAMESPACE}}
type: Opaque
stringData:
  nats.conf: |
    port: 4222
    http_port: 8222
    
    authorization {
      user: "{{SECRET:nats-user}}"
      password: "{{SECRET:nats-pass}}"
    }

---

# postgres writer credentials – full read/write access, used by backend services
apiVersion: v1
kind: Secret
metadata:
  name: postgres-writer-secret
  namespace: {{PREFIX}}-{{NAMESPACE}}
type: Opaque
stringData:
  username: "{{SECRET:sql-writer-user}}"
  password: "{{SECRET:sql-writer-pass}}"
  url: "postgresql://{{SECRET:sql-writer-user}}:{{SECRET:sql-writer-pass}}@postgres:5432/{{SECRET:sql-db}}"

---

# postgres reader credentials – read-only access, used by api / reporting
apiVersion: v1
kind: Secret
metadata:
  name: postgres-reader-secret
  namespace: {{PREFIX}}-{{NAMESPACE}}
type: Opaque
stringData:
  username: "{{SECRET:sql-reader-user}}"
  password: "{{SECRET:sql-reader-pass}}"
  url: "postgresql://{{SECRET:sql-reader-user}}:{{SECRET:sql-reader-pass}}@postgres:5432/{{SECRET:sql-db}}"

---

# postgres superuser / init credentials – only used by the statefulset itself
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{PREFIX}}-{{NAMESPACE}}
type: Opaque
stringData:
  db: "{{SECRET:sql-db}}"
  username: "{{SECRET:sql-root-user}}"
  password: "{{SECRET:sql-root-pass}}"
  # init sql: creates writer + reader roles on first boot
  init.sql: |
    CREATE USER "{{SECRET:sql-writer-user}}" WITH PASSWORD '{{SECRET:sql-writer-pass}}';
    GRANT CONNECT ON DATABASE "{{SECRET:sql-db}}" TO "{{SECRET:sql-writer-user}}";
    GRANT USAGE ON SCHEMA public TO "{{SECRET:sql-writer-user}}";
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "{{SECRET:sql-writer-user}}";
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO "{{SECRET:sql-writer-user}}";

    CREATE USER "{{SECRET:sql-reader-user}}" WITH PASSWORD '{{SECRET:sql-reader-pass}}';
    GRANT CONNECT ON DATABASE "{{SECRET:sql-db}}" TO "{{SECRET:sql-reader-user}}";
    GRANT USAGE ON SCHEMA public TO "{{SECRET:sql-reader-user}}";
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO "{{SECRET:sql-reader-user}}";
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO "{{SECRET:sql-reader-user}}";