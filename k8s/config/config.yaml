# the images to be used in the project
images:
  # the link to the dockerhub / pull page, the image name and the version to be used
  postgresql:
    link: "https://hub.docker.com/_/postgresql"
    image: postgresql
    version: 18.3

  nats:
    link: "https://hub.docker.com/_/nats"
    image: nats
    version: 2.9.17

  dragonfly:
    link: "https://hub.docker.com/r/dragonflydb/dragonfly"
    image: dragonflydb/dragonfly
    version: v1.27.1

# the ports for the exposing
ports:
  # the port to host minecraft on (25565 is the default minecraft port)
  minecraft: 25565