apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{PREFIX}}-{{NAMESPACE}}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---

# may don't put this in shared, but for now it is easier to manage
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-environment
  namespace: {{PREFIX}}-{{NAMESPACE}}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              environment: {{ENVIRONMENT}}

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              environment: {{ENVIRONMENT}}

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet-egress
  namespace: {{PREFIX}}-{{NAMESPACE}}
spec:
  podSelector: {}
  policyTypes:
    - Egress

  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0